name: Build Liqueurs APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Police du lettrage (style étiquette), embarquée dans l'appli pour fonctionner hors ligne.
      - name: Embarquer la police
        run: |
          curl -fsSL -o app/src/main/assets/Federo.ttf https://github.com/google/fonts/raw/main/ofl/federo/Federo-Regular.ttf || echo "Police non trouvée, repli système"

      - name: Compiler l'APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk "Liqueurs-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Liqueurs-apk
          path: Liqueurs-*.apk

      # Publie l'APK dans « Releases ».
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: tablette-${{ github.run_number }}
          name: Liqueurs tablette · build ${{ github.run_number }}
          files: Liqueurs-*.apk
          make_latest: true
